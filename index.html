<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ウェブカラー見本</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
      margin: 0;
      padding-bottom: 2rem;
      color: #222;
      background: #f2f2f2;
    }
    /* 中身は画面幅いっぱいに広げる。左右の余白は画面幅の 8% の割合で切れ目なく広がり、
       スマートフォン（375px）で 1rem、約 1780px 以上で上限の 8rem になる */
    body > * {
      padding-inline: clamp(1rem, 8vw - 0.875rem, 8rem);
    }
    /* ページ最上部の 139 色の帯 */
    #stripe {
      display: flex;
      height: 1rem;
      padding-inline: 0;
    }
    #stripe span { flex: 1; }
    /* タイトルからページ内リンクまでを白いヘッダーに */
    header {
      background: #fff;
      padding-block: 1.5rem 0.25rem;
    }
    h1 { margin: 0; }
    header p { margin: 1rem 0 0.75rem; }
    h2 {
      margin: 2.5rem 0 1rem;
      font-size: 1.15rem;
      /* 上に固定したリンクの帯に隠れないように（帯の高さは JS で --nav-h に入れる） */
      scroll-margin-top: calc(var(--nav-h, 4rem) + 0.75rem);
    }
    nav.bands {
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem 1rem;
      padding-block: 0.75rem;
      background: #fff;
      border-bottom: 1px solid #d6d6d6;
    }
    nav.bands .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    nav.bands .links[hidden],
    .view[hidden] { display: none; }
    nav.bands a {
      padding: 0.3rem 0.8rem;
      border: 1px solid #d6d6d6;
      border-radius: 999px;
      background: #fff;
      color: inherit;
      font-size: 0.85rem;
      text-decoration: none;
    }
    nav.bands a:hover { background: #f0f0f0; }
    /* 明るさ／色相の切り替えスイッチ */
    .view-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0;
      border: none;
      background: none;
      font: inherit;
      font-size: 0.85rem;
      color: inherit;
      cursor: pointer;
    }
    .view-toggle .opt { color: #999; transition: color 0.2s; }
    .view-toggle[aria-checked="false"] .opt:first-child,
    .view-toggle[aria-checked="true"] .opt:last-child {
      color: #222;
      font-weight: bold;
    }
    .view-toggle .track {
      position: relative;
      width: 2.6rem;
      height: 1.4rem;
      border-radius: 999px;
      background: gold; /* 「明るさ」のとき */
      transition: background 0.2s;
    }
    .view-toggle[aria-checked="true"] .track { background: #4a90e2; }
    .view-toggle .knob {
      position: absolute;
      top: 0.15rem;
      left: 0.15rem;
      width: 1.1rem;
      height: 1.1rem;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s;
    }
    .view-toggle[aria-checked="true"] .knob { transform: translateX(1.2rem); }
    .view-toggle:focus-visible .track { outline: 2px solid #4a90e2; outline-offset: 2px; }
    .grid {
      display: grid;
      /* 色名と HSL の値が 1 行に収まる幅（特に長い色名は .long で小さくする） */
      grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr));
      gap: 1rem;
    }
    .swatch {
      border: 1px solid #d6d6d6;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
    }
    .swatch .chip {
      height: 80px;
      /* 白に近い色でだけ見える、うっすらした区切り線 */
      box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.08);
    }
    .swatch .label {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.1rem;
      padding: 0.9rem 0.95rem 1rem;
      font-size: 0.9rem;
      line-height: 1.4;
    }
    .copy {
      font: inherit;
      color: inherit;
      background: none;
      border: none;
      border-radius: 4px;
      padding: 0.15rem 0.35rem;
      margin: 0 -0.35rem;
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
    }
    .copy:hover { background: #f0f0f0; }
    .copy:focus-visible { outline: 2px solid #4a90e2; }
    .copy.name {
      font-size: 1.05rem;
      font-weight: bold;
    }
    .copy.name.long {
      font-size: 0.85rem;
      line-height: calc(1.05rem * 1.4); /* ほかの色名と同じ行の高さに */
    }
    .copy.hex,
    .copy.rgb,
    .copy.hsl {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 0.8rem;
      color: #666;
    }
    .copy.hex { margin-top: 0.4rem; }
    .copy.copied { background: #e8f5e9; }
    #toast {
      position: fixed;
      left: 50%;
      bottom: 1.5rem;
      transform: translate(-50%, 1rem);
      background: #222;
      color: #fff;
      padding: 0.6rem 1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>
  <div id="stripe" aria-hidden="true"></div>
  <header>
    <h1>ウェブカラー見本</h1>
    <p>CSS で使える色名（139 色）を、明るさ 5 段階 or 色相で 6 区分でリストアップします。色名や値をクリックするとクリップボードにコピーできます。</p>

    </button>
    <div class="links" data-view="lightness">
      <a href="#very-light">とても明るい</a>
      <a href="#light">明るい</a>
      <a href="#medium">中くらい</a>
      <a href="#dark">暗い</a>
      <a href="#very-dark">とても暗い</a>
    </div>
    <div class="links" data-view="hue" hidden>
      <a href="#gray">灰系</a>
      <a href="#red">赤系</a>
      <a href="#yellow">黄系</a>
      <a href="#green">緑系</a>
      <a href="#blue">青系</a>
      <a href="#purple">紫系</a>
    </div>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>
  <script>
    // 各色の 16 進数から RGB と HSL を求めて、コピーできるボタンとして追加する
    function hexToRgb(hex) {
      const n = parseInt(hex.slice(1), 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function rgbToHsl([r, g, b]) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      const d = max - min;
      const l = (max + min) / 2;
      let h = 0, s = 0;
      if (d !== 0) {
        s = d / (1 - Math.abs(2 * l - 1));
        if (max === r) h = ((g - b) / d) % 6;
        else if (max === g) h = (b - r) / d + 2;
        else h = (r - g) / d + 4;
        h = (h * 60 + 360) % 360;
      }
      return [Math.round(h), Math.round(s * 100), Math.round(l * 100)];
    }

    function makeCopyButton(cls, text) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = `copy ${cls}`;
      btn.title = 'クリックでコピー';
      btn.textContent = text;
      return btn;
    }

    document.querySelectorAll('.swatch .label').forEach((label) => {
      const hex = label.querySelector('.hex').textContent.trim();
      const rgb = hexToRgb(hex);
      const [h, s, l] = rgbToHsl(rgb);
      label.append(
        makeCopyButton('rgb', `rgb(${rgb.join(' ')})`),
        makeCopyButton('hsl', `hsl(${h} ${s}% ${l}%)`)
      );
    });

    // ページ最上部の帯: 色見本と同じ順に 139 色を並べる
    // ページ最上部の帯: 表示中の並びと同じ順に 139 色を並べる
    const stripe = document.getElementById('stripe');
    function drawStripe(view) {
      stripe.replaceChildren(...[...document.querySelectorAll(`.view[data-view="${view}"] .swatch .name`)].map((btn) => {
        const span = document.createElement('span');
        span.style.background = btn.textContent.trim();
        span.title = btn.textContent.trim();
        return span;
      }));
    }

    // 固定した帯の高さ（折り返すと変わる）を見出しの止まる位置に使う
    const nav = document.querySelector('nav.bands');
    function updateNavHeight() {
      document.documentElement.style.setProperty('--nav-h', `${nav.offsetHeight}px`);
    }
    new ResizeObserver(updateNavHeight).observe(nav);

    // 明るさ／色相の切り替え。選んだ並びは次に開いたときも使う
    const toggle = document.querySelector('.view-toggle');
    function showView(view) {
      document.querySelectorAll('.view, nav.bands .links').forEach((el) => {
        el.hidden = el.dataset.view !== view;
      });
      toggle.setAttribute('aria-checked', String(view === 'hue'));
      updateNavHeight(); // リンクの数が変わると帯の高さも変わるので、すぐに反映
      drawStripe(view);
      try { localStorage.setItem('web-color-view', view); } catch (e) {}
    }
    toggle.addEventListener('click', () => {
      showView(toggle.getAttribute('aria-checked') === 'true' ? 'lightness' : 'hue');
    });
    // #dark などの段へのリンクで開いたときは、その段がある並びを表示する
    function viewFromHash() {
      const target = location.hash && document.getElementById(location.hash.slice(1));
      const view = target && target.closest('.view');
      return view ? view.dataset.view : null;
    }
    let saved = null;
    try { saved = localStorage.getItem('web-color-view'); } catch (e) {}
    showView(viewFromHash() || (saved === 'hue' ? 'hue' : 'lightness'));

    // 段を表示に切り替えてから、その見出しまでスクロールする
    // （隠れている段にはブラウザーがスクロールできないため）
    function scrollToHash() {
      const target = location.hash && document.getElementById(location.hash.slice(1));
      if (target) target.scrollIntoView();
    }
    if (location.hash) {
      history.scrollRestoration = 'manual'; // リロード時に前の位置へ戻さない
      window.addEventListener('load', scrollToHash);
    }
    window.addEventListener('hashchange', () => {
      const view = viewFromHash();
      if (view) showView(view);
      scrollToHash();
    });

    const toast = document.getElementById('toast');
    let toastTimer;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1500);
    }

    document.addEventListener('click', async (e) => {
      const btn = e.target.closest('.copy');
      if (!btn) return;
      try {
        const text = btn.textContent.trim();
        await navigator.clipboard.writeText(text);
        btn.classList.add('copied');
        clearTimeout(btn._timer);
        btn._timer = setTimeout(() => btn.classList.remove('copied'), 1200);
        showToast(`「${text}」をコピーしました`);
      } catch (err) {
        alert('コピーできませんでした: ' + err);
      }
    });
  </script>
