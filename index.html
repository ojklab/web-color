<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ウェブカラー見本</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
      margin: 0 auto;
      padding: 2rem 1rem;
      max-width: 960px;
      color: #222;
    }
    h1 { margin-top: 0; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 1rem;
    }
    .swatch {
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
    }
    .swatch .chip { height: 80px; }
    .swatch .label {
      padding: 0.5rem;
      font-size: 0.85rem;
    }
    .swatch code { color: #666; }
  </style>
</head>
<body>
  <h1>ウェブカラー見本</h1>
  <p>準備中です。</p>
  <div class="grid">
    <div class="swatch"><div class="chip" style="background:red"></div><div class="label">red<br><code>#FF0000</code></div></div>
    <div class="swatch"><div class="chip" style="background:green"></div><div class="label">green<br><code>#008000</code></div></div>
    <div class="swatch"><div class="chip" style="background:blue"></div><div class="label">blue<br><code>#0000FF</code></div></div>
    <div class="swatch"><div class="chip" style="background:orange"></div><div class="label">orange<br><code>#FFA500</code></div></div>
    <div class="swatch"><div class="chip" style="background:rebeccapurple"></div><div class="label">rebeccapurple<br><code>#663399</code></div></div>
  </div>
</body>
</html>
